name: publish

# Publish an existing release tag to the Bend hub as emerging-ezaudio@X.Y.Z.0 by hand,
# e.g. to retry a release whose automatic publish failed. Releases are
# published automatically by release-please.yml. dry-run runs every check
# (proof gate, LICENSE, the hub's name check) and stops before the upload.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish, e.g. v1.2.0"
        required: true
        type: string
      dry-run:
        description: "Check everything, upload nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    uses: Emerging-Patterns/actions/.github/workflows/publish.yml@0fb03f81b72096c8db54be388d09ef5ab75fed3f
    with:
      tag: ${{ inputs.tag }}
      hub-name: emerging-ezaudio
      dry-run: ${{ inputs.dry-run }}
    secrets:
      bend-key: ${{ secrets.BEND_HUB_KEY }}
