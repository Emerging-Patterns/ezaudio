name: release-please

# release-please opens the release PR from conventional commits; merging it
# tags vX.Y.Z and creates the GitHub release. The publish job then sends that
# tag to the Bend hub as emerging-ezaudio@X.Y.Z.0: the shared publish workflow runs the
# proof gate and refuses a package with no LICENSE beside its entry before it
# uploads, since an upload is public and permanent. BEND_HUB_KEY is the Bender
# login of the account that owns the hub name.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Emerging-Patterns/actions/.github/workflows/release-please.yml@0fb03f81b72096c8db54be388d09ef5ab75fed3f
    with:
      config-file: .github/release-please-config.json
      manifest-file: .github/release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: Emerging-Patterns/actions/.github/workflows/publish.yml@0fb03f81b72096c8db54be388d09ef5ab75fed3f
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      hub-name: emerging-ezaudio
    secrets:
      bend-key: ${{ secrets.BEND_HUB_KEY }}
